<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Piano Alimentare Famiglia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"></div>
      <div><div class="brand-title">Piano alimentare</div><div id="brandDate" class="brand-sub"></div></div>
    </div>
    <div id="personeBar" class="avatars"></div>
    <nav id="tabs" class="tabs"></nav>
  </header>

  <main id="view"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div id="sheetTitle" class="sheet-title"></div>
        <button id="sheetClose" class="icon-btn" aria-label="Chiudi"></button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetFoot" class="sheet-foot" hidden></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
