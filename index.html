<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f855a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <title>Piano Alimentare Famiglia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🥗 Piano Alimentare</h1>
    <div id="personeBar" class="persone"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-view="oggi">📅<span>Oggi</span></button>
    <button data-view="settimana">🗓️<span>Settimana</span></button>
    <button data-view="schede">📋<span>Schede</span></button>
    <button data-view="spesa">🛒<span>Spesa</span></button>
    <button data-view="impostazioni">⚙️<span>Altro</span></button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon-btn" aria-label="Chiudi">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
